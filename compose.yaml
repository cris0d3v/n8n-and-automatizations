# Local development without a domain or reverse proxy.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    restart: unless-stopped

    # Keep n8n accessible only from this machine.
    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Caracas}
      - TZ=${GENERIC_TIMEZONE:-America/Caracas}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
